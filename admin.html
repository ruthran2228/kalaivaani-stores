<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b3a">
  <meta name="robots" content="noindex">
  <title>Kalaivani Stores – Admin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="adminstyle.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app" id="app" hidden></div>

  <div class="auth-screen" id="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="logo-img" src="logo.svg" alt="Kalaivani Stores" width="42" height="42">
        <div>
          <strong>Kalaivani Stores</strong>
          <small>Store admin</small>
        </div>
      </div>
      <form id="login-form" class="auth-form">
        <h1>Sign in</h1>
        <p class="auth-sub">Use your store admin account to manage products and orders.</p>
        <label>Email
          <input id="login-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Your password" required>
        </label>
        <p class="auth-error" id="login-error" hidden></p>
        <div class="auth-hint" id="login-hint" hidden></div>
        <button class="primary-btn" id="login-btn" type="submit">Sign in</button>
        <a class="auth-link" id="back-to-site" href="./">← Back to the store</a>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
  <script src="config.js?v=20261008a"></script>
  <script src="admin.js?v=20261008a"></script>
</body>
</html>
