<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06150E">
  <meta name="robots" content="noindex">
  <title>My Orders – Kalaivani Stores</title>
  <link rel="stylesheet" href="orders.css?v=20260925c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="page-header">
    <a class="brand" href="./index.html">
      <span class="logo-mark">KS</span>
      <span><strong>Kalaivani Stores</strong><small>My orders</small></span>
    </a>
    <div class="header-right">
      <a class="back-btn" href="./profile.html">Profile</a>
      <a class="back-btn" href="./index.html">← Back to store</a>
      <button class="logout-btn" id="logout-btn" type="button" hidden>Log out</button>
    </div>
  </header>

  <main class="page" id="page">
    <!-- HISTORY VIEW -->
    <section class="history-view" id="history-view" hidden>
      <div class="page-head">
        <div>
          <span class="kicker">HELLO <span id="hello-name"></span></span>
          <h1>My orders</h1>
          <p id="history-count"></p>
          <p id="live-hint" class="live-hint" hidden><span class="live-dot"></span> Auto-updates — no refresh needed</p>
        </div>
        <button class="track-own-btn" id="track-own-btn" type="button">
          🔎 Track by order number
        </button>
      </div>

      <div class="orders-list" id="orders-list"></div>
      <div class="empty-state" id="history-empty" hidden>
        <div class="empty-icon">📦</div>
        <h3>No orders yet</h3>
        <p>When you place an order while signed in, it will show up here.</p>
        <a class="primary-btn" href="./index.html">Start shopping</a>
      </div>

      <div class="guest-card" id="guest-card">
        <button class="guest-toggle" id="guest-toggle" type="button">
          Track a past order by order number
        </button>
        <form class="guest-form" id="guest-form" novalidate hidden>
          <div class="guest-head"><span>🔎</span><strong>Track a past order</strong></div>
          <label>Order number
            <input id="guest-number" type="text" autocomplete="off" spellcheck="false"
              placeholder="e.g. KS-1A2B3C4D" aria-label="Order number">
          </label>
          <label>Phone number used for the order
            <input id="guest-phone" type="tel" inputmode="tel" autocomplete="tel" spellcheck="false"
              placeholder="The phone used when ordering…" aria-label="Phone number">
          </label>
          <button class="primary-btn" id="guest-submit" type="submit">Track order</button>
          <div id="guest-result"></div>
        </form>
      </div>
    </section>

    <!-- TRACK VIEW -->
    <section class="track-view" id="track-view" hidden>
      <button class="back-to-list" id="back-to-list" type="button">← Back to my orders</button>
      <div class="track-current" id="track-current"></div>
    </section>
  </main>

  <footer class="page-footer">© 2026 Kalaivani Stores · <a href="./index.html">Back to the store</a></footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="config.js?v=20260923d"></script>
  <script src="orders.js?v=20260923f"></script>
</body>
</html>
